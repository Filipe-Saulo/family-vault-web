name: CI

# Lint, testes e build a cada push/PR; a imagem (build do Vite + nginx) é montada e testada em todo PR e publicada no
# GitHub Container Registry só no push para a main. O deploy na Azure (OIDC) está desenhado no fim, comentado: os
# recursos ainda não existem.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  image:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # O GHCR exige o nome em minúsculas (o dono do repositório tem maiúsculas)
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/family-vault-web" >> "$GITHUB_ENV"

      - name: Build
        run: docker build --tag "$IMAGE:${{ github.sha }}" .

      # Teste de fumaça: sem API_UPSTREAM o container não sobe; com uma API falsa (um nginx que responde o caminho
      # recebido), confere o fallback da SPA, o cache dos assets e o repasse de /api/* sem reescrever o caminho.
      - name: Smoke test
        run: |
          docker run -d --name noupstream "$IMAGE:${{ github.sha }}"
          sleep 3
          test "$(docker inspect -f '{{.State.Running}}' noupstream)" = "false"
          docker logs noupstream 2>&1 | grep "API_UPSTREAM ausente" > /dev/null
          docker run -d --name trailingslash -e API_UPSTREAM=http://fakeapi/ "$IMAGE:${{ github.sha }}"
          sleep 3
          test "$(docker inspect -f '{{.State.Running}}' trailingslash)" = "false"

          echo 'server { listen 80; location / { default_type text/plain; return 200 "api:$request_uri"; } }' > fakeapi.conf
          docker network create smoke
          docker run -d --name fakeapi --network smoke -v "$PWD/fakeapi.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine
          sleep 2
          docker run -d --name web --network smoke -p 8080:8080 -e API_UPSTREAM=http://fakeapi "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 15); do curl -fsS http://localhost:8080/healthz > /dev/null 2>&1 && break; sleep 1; done

          curl -fsS http://localhost:8080/ | grep '<div id="root">' > /dev/null
          curl -fsS http://localhost:8080/usuarios/qualquer | grep '<div id="root">' > /dev/null
          curl -fsSI http://localhost:8080/ | grep -i '^cache-control: no-cache' > /dev/null
          ASSET=$(curl -fsS http://localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -fsSI "http://localhost:8080$ASSET" | grep -i '^cache-control: public, max-age=31536000, immutable' > /dev/null
          test "$(curl -fsS http://localhost:8080/api/web/refreshtoken?x=1)" = "api:/api/web/refreshtoken?x=1"
          test "$(docker exec web id -u)" != "0"

      - name: Smoke test logs
        if: failure()
        run: docker logs web || true

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # Deploy na Azure: desenhado, ainda desligado (os recursos não existem). Para ligar:
  # 1. Federated credential do GitHub para este repositório (subject repo:<dono>/Family-Vault-Web:environment:production)
  #    no mesmo app registration da API; AZURE_CLIENT_ID, AZURE_TENANT_ID e AZURE_SUBSCRIPTION_ID em Settings > Variables.
  # 2. Container App "family-vault-web" com API_UPSTREAM apontando para a API, sonda em /healthz e escala a zero.
  # 3. Pacote do GHCR público, ou credencial de leitura do registro configurada no Container App.
